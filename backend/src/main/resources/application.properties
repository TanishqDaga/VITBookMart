spring.application.name=VITBookMart
spring.mongodb.uri=${Mongo_URL}
spring.data.mongodb.auto-index-creation=true
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# When a request is rejected before its body is read (expired token, oversized
# upload), Tomcat drains at most this much before resetting the connection.
# The 2MB default is below a typical phone photo, so the client saw a network
# error instead of the 401/413. Keep this above max-request-size.
server.tomcat.max-swallow-size=10MB
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}
jwt.secret=${JWT_SECRET}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
# Redis cache TTL
vitbookmart.cache.listing.ttl-hours=12
vitbookmart.cache.latest.ttl-hours=2
vitbookmart.cache.search.ttl-hours=2
